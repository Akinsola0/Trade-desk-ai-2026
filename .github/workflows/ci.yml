name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Applies schema.sql + every migration to a throwaway Postgres and runs the
  # tenant-isolation / tamper / RPC assertions. A single FAIL line fails the job.
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tdtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tdtest
    steps:
      - uses: actions/checkout@v4
      - name: Run RLS suite
        run: ./supabase/tests/run.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Builds in demo mode (no Supabase env), which is what a fork/PR has.
      - run: npm run build
